# Automatically creates release PRs and, when a release-please release lands,
# builds and uploads the four ans-openshell binaries to that release and
# publishes the chart's container images to ghcr.io in the same workflow run.
#
# Why these are combined: events triggered by GITHUB_TOKEN (such as
# release-please publishing a release) do NOT trigger downstream workflows.
# Splitting goreleaser into its own `release: published` workflow would silently
# never fire. Running goreleaser as a needs:-gated job in the same workflow
# avoids this entirely without requiring a PAT.
# Docs: https://docs.github.com/en/actions/security-guides/automatic-token-authentication
name: Release

on:
  push:
    branches:
      - main
  # Manual trigger for recovery scenarios (e.g., re-running after a failed release).
  workflow_dispatch:

# contents:write is required for creating git tags, GitHub Releases, and uploading release assets.
# pull-requests:write is required for creating and updating release PRs.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: Build & upload binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so `git describe` resolves the version.
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-images:
    name: Publish container images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        cmd: [ans-openshell-middleware, ans-openshell-interceptor, ans-ocsf-hydrator]
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      CMD: ${{ matrix.cmd }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-please tags vX.Y.Z and bumps Chart.yaml appVersion to X.Y.Z, the chart's
      # default image tag, so the pushed tag is the version without its v prefix. The
      # Dockerfile cross-compiles, so both platforms build natively. The first push
      # creates each package private; make it public once in the organisation's package
      # settings or the chart defaults cannot pull it.
      - name: Build and push
        run: |
          VERSION="${TAG#v}"
          docker buildx build --platform linux/amd64,linux/arm64 -f deploy/Dockerfile \
            --build-arg CMD="${CMD}" --build-arg VERSION="${VERSION}" \
            -t "ghcr.io/${OWNER}/${CMD}:${VERSION}" --push .
