# Runs the extension against the pinned OpenShell release with a real gateway,
# supervisor and sandbox on the Docker driver. Slower than the unit suite and
# dependent on GitHub's Docker daemon and ghcr.io, so it runs on pushes to main,
# on pull requests that touch what it exercises, and on demand.
name: OpenShell smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "cmd/ans-openshell-middleware/**"
      - "cmd/ans-reference-callee/**"
      - "internal/**"
      - "gen/**"
      - "third_party/openshell/**"
      - "examples/openshell-smoke/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/openshell-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Gateway, supervisor and sandbox on Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: "1.26.9"
      - name: Cache OpenShell release assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ~/.cache/ans-openshell-smoke
          key: openshell-${{ hashFiles('examples/openshell-smoke/openshell-release.env') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Run the smoke test
        # A fixed TMPDIR makes the retained log directory addressable by the
        # upload step below; the gateway runs at debug so a middleware_failed
        # verdict on CI explains itself.
        env:
          TMPDIR: ${{ runner.temp }}/smoke
          ANS_SMOKE_LOG_LEVEL: debug
        run: |
          mkdir -p "$TMPDIR"
          make openshell-smoke
      - name: Upload retained logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: openshell-smoke-logs
          path: ${{ runner.temp }}/smoke/ans-openshell-smoke.*/logs/
          if-no-files-found: ignore
          retention-days: 7
