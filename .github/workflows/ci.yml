# Build, test with a coverage gate, lint, and check that generated bindings match the vendored protos.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: "1.26.9"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 #v5.0.1
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage gate
        run: |
          # Generated bindings, thin main packages and the demo are exercised end to end,
          # not by unit tests; the gate covers the library packages.
          grep -v -e '/gen/' -e '/cmd/' -e '/examples/' coverage.out > coverage.lib.out
          COVERAGE=$(go tool cover -func=coverage.lib.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "library coverage: ${COVERAGE}%"
          THRESHOLD=95
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the required ${THRESHOLD}% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: "1.26.9"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a #v9.3.0
        with:
          version: v2.10.1
          args: --verbose --concurrency=4 --allow-parallel-runners

  deploy-artifacts:
    name: Container images & Helm chart
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cmd: [ans-openshell-middleware, ans-openshell-interceptor, ans-ocsf-hydrator, ans-reference-callee]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Build image
        run: docker build -f deploy/Dockerfile --build-arg CMD=${{ matrix.cmd }} -t ${{ matrix.cmd }}:ci .
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 #v5.0.1
      - name: Lint and render chart
        run: |
          helm lint deploy/helm/ans-openshell
          helm template ci deploy/helm/ans-openshell --set hydrator.enabled=true > /dev/null

  proto-drift:
    name: Generated bindings match protos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: "1.26.9"
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 #v1.6.0
        with:
          setup_only: true
          # Pinned so the drift check is reproducible; make proto documents the plugin pins.
          version: 1.73.0
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Regenerate and diff
        run: |
          buf generate
          git diff --exit-code -- gen/
